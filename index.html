<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>TOEIC RC 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="RC노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ───── 디자인 토큰 (iOS 시스템 색 기준) ───── */
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#1d1d1f; --sub:#6e6e73; --sub2:#8e8e93;
  --line:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --pri:#007aff; --pri-soft:rgba(0,122,255,.1);
  --ok:#248a3d; --ok-f:#34c759; --ok-soft:rgba(52,199,89,.12);
  --bad:#d70015; --bad-f:#ff3b30; --bad-soft:rgba(255,59,48,.1);
  --warn:#c93400; --warn-f:#ff9500; --warn-soft:rgba(255,149,0,.12);
  --pur:#8944ab; --pur-soft:rgba(175,82,222,.12);
  --code:var(--fill); --shadow:none;
  --bar-bg:rgba(249,249,249,.88); --serif:"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --sub:#98989d; --sub2:#8e8e93;
    --line:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --pri:#0a84ff; --pri-soft:rgba(10,132,255,.18);
    --ok:#30d158; --ok-f:#30d158; --ok-soft:rgba(48,209,88,.16);
    --bad:#ff453a; --bad-f:#ff453a; --bad-soft:rgba(255,69,58,.16);
    --warn:#ff9f0a; --warn-f:#ff9f0a; --warn-soft:rgba(255,159,10,.16);
    --pur:#bf5af2; --pur-soft:rgba(191,90,242,.18); --bar-bg:rgba(22,22,24,.86); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
button:active{opacity:.6}
.wrap{max-width:640px;margin:0 auto;padding:10px 16px 32px}
h1{font-size:30px;line-height:1.15;font-weight:700;margin:14px 0 6px;letter-spacing:-.025em}
h2{font-size:20px;font-weight:700;margin:28px 0 10px;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.card[onclick]{cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--sub)}
.card.stat{padding:14px}
.btn{display:block;width:100%;min-height:50px;padding:13px 16px;border-radius:14px;background:var(--pri);color:#fff;font-weight:600;font-size:16.5px;text-align:center;letter-spacing:-.015em}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.line{background:var(--card);color:var(--ink)}
.card .btn.line,.sheet .btn.line{background:var(--fill)}
.btn:disabled{opacity:.35}
/* 카드 안 버튼은 한 단계 낮게: 회색 바탕 + 파란 글씨 */
.card .btn{min-height:44px;padding:10px 12px;font-size:15px;border-radius:12px}
.card .btn.ghost{background:var(--fill);color:var(--pri)}
.card .btn:not(.ghost):not(.line){min-height:48px;font-size:16px}
.chip{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--fill);font-size:14px;margin:3px 4px 3px 0;font-weight:500}
.chip.on{background:var(--pri);color:#fff}
.chip.c{background:var(--pri-soft);color:var(--pri)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--fill);color:var(--sub);margin-right:5px;vertical-align:1px}
.d1{background:var(--ok-soft);color:var(--ok)} .d2{background:var(--warn-soft);color:var(--warn)} .d3{background:var(--bad-soft);color:var(--bad)} .d4{background:var(--pur-soft);color:var(--pur)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar button{flex:1;padding:7px 0 5px;font-size:10.5px;font-weight:500;color:var(--sub2);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:0}
.tabbar button.on{color:var(--pri)}
.tabbar button:active{opacity:1}
.tabbar svg{width:25px;height:25px}
.q{font-size:17px;line-height:1.55;font-weight:600;margin:6px 0 10px;word-break:keep-all}
pre.code{background:var(--fill2);border-radius:12px;padding:12px 14px;font:13px/1.55 ui-monospace,"SF Mono",Menlo,monospace;overflow-x:auto;margin:0 0 12px;white-space:pre}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);margin:8px 0;line-height:1.45;word-break:keep-all;align-items:flex-start;transition:box-shadow .15s,background .15s}
.opt:active{opacity:1;transform:scale(.99)}
.opt .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--fill);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-top:-1px}
.opt.sel{box-shadow:inset 0 0 0 2px var(--pri)} .opt.sel .n{background:var(--pri);color:#fff}
.opt.right{box-shadow:inset 0 0 0 2px var(--ok-f);background:var(--ok-soft)} .opt.right .n{background:var(--ok-f);color:#fff}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--bad-f);background:var(--bad-soft)} .opt.wrong .n{background:var(--bad-f);color:#fff}
.sheet .opt,.card .opt{background:var(--fill2)}
.exp{background:var(--card);border-radius:18px;padding:16px 18px;margin:14px 0;line-height:1.6;font-size:15.5px}
.exp > b:first-child{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.exp > b:first-child + br{display:none}
.exp.ok > b:first-child{color:var(--ok)} .exp.no > b:first-child{color:var(--bad)}
.exp.ok > b:first-child::before{content:"✓  "} .exp.no > b:first-child::before{content:"✕  "}
.sheet .exp{background:var(--fill2)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .4s ease}
.bar.low i{background:var(--bad-f)} .bar.mid i{background:var(--warn-f)} .bar.high i{background:var(--ok-f)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:13px 0;box-shadow:0 .5px 0 var(--line);gap:12px}
.list .it:last-child{box-shadow:none}
.list .it[onclick]{cursor:pointer}
.card.list{padding-top:4px;padding-bottom:4px}
.muted{color:var(--sub)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon-btn{padding:7px 14px;border-radius:999px;background:var(--fill);font-size:14.5px;font-weight:500;color:var(--pri);min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center}
.qbar{position:sticky;top:0;z-index:15;margin:-10px -16px 0;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.qbar .icon-btn:first-child{padding:0;width:34px;color:var(--ink);font-size:15px}
.qbar .qprog{height:3px;margin-top:8px}
.qbar + *{margin-top:12px}
.qbar .sub{font-weight:600;color:var(--ink);font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 14px}
ul.sum{padding-left:20px;margin:6px 0;line-height:1.65}
ul.sum li{margin:4px 0}
code{background:var(--fill);padding:1px 6px;border-radius:6px;font-size:.92em;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.trap{background:var(--warn-soft);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.55}
.trap > b:first-child{color:var(--warn)}
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;font-size:22px;line-height:1.5;word-break:keep-all;border-radius:22px}
.flash small{display:block;font-size:14px;color:var(--sub);margin-top:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;letter-spacing:0}
table.t{border-collapse:collapse;font:12px/1.4 ui-monospace,Menlo,monospace;width:100%}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;white-space:nowrap}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,32,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.18)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{box-shadow:0 0 0 3px var(--pri-soft)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin:8px 0 14px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.1),0 1px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){ .seg button.on{background:#636366} }
.card > b:first-child{font-size:16px;font-weight:600}
.big{font-size:56px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{display:inline-block;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:600}
/* 표기법 그림 */
.figs{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:4px 0 12px;background:var(--fill2);border-radius:12px;padding:12px}
svg.fig{max-width:100%;height:auto;display:block}
svg.fig.sm{width:180px;max-width:100%}
@media (min-width: 700px){ .figs svg.fig{width:420px} svg.fig.sm{width:210px} }
.rounds{display:flex;flex-wrap:wrap;gap:2px}
.rounds .chip{font-size:13px}
.navrow{display:grid;grid-template-columns:1fr 2.2fr;gap:10px;margin-top:16px}
.navrow .btn.line{background:var(--card)}
/* 문제 위 테이블 */
.qt{position:relative;background:var(--fill2);border-radius:12px;padding:8px 8px 6px;margin:6px 0 10px;overflow-x:auto}
.qt-t + .qt-t{margin-top:8px}
.qt-t b{font-size:12px;color:var(--sub);letter-spacing:.3px}
table.qt-tb{font-size:10px;width:auto;min-width:100%;letter-spacing:-.2px}
table.qt-tb th,table.qt-tb td{padding:2px 3px;border-bottom:1px solid var(--line)}
table.qt-tb tr:last-child td{border-bottom:0}
.tfold{position:absolute;right:8px;top:6px;font-size:12px;color:var(--sub);padding:2px 6px;z-index:2}
.qt-in{margin:0 0 10px} .qt-in + .qt-in{margin-top:-2px}
.tfold-open{font-size:13px;color:var(--pri);padding:6px 0;margin:2px 0 4px}
/* 필기 */
.inkw{position:relative}
.inkw .ink{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
.inkw.inking .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.inkw.inking{-webkit-user-select:none;user-select:none;outline:2px dashed var(--pri-soft);outline-offset:4px;border-radius:8px}
.inkw.inking .tfold{visibility:hidden}
.inkbtn{font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--fill);color:var(--ink);white-space:nowrap}
.inkbtn.on{background:var(--pri);color:#fff}
.inkbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.inkbar .dot{width:24px;height:24px;border-radius:50%;background:var(--c);border:2.5px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.inkbar .dot.on{box-shadow:0 0 0 2px var(--c)}
/* 문제 카드: 영어 문장을 흰 카드에 */
.qcard{background:var(--card);border-radius:18px;padding:18px 18px 16px;margin:10px 0 4px}
.qcard .q.en{margin:0}
/* 화면 전체 필기 (SQLD 합격노트 방식) */
.inkall .inkbar,.inkall .inkbtn{position:relative;z-index:4}
.inkall.inking{outline:2px dashed var(--pri-soft);outline-offset:6px;border-radius:12px}
.inkall.inking .qa *{pointer-events:none}
.inkall.inking .qa .inkbar,.inkall.inking .qa .inkbar *,.inkall.inking .qa .inkbtn{pointer-events:auto}
.inkall .ink{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.inkall.inking .psg-sc,.inkall.hasink .psg-sc{max-height:none!important;overflow:visible}
.inkall.inking .psg-bt .psg-tg:not(.tr-tg),.inkall.hasink .psg-bt .psg-tg:not(.tr-tg){display:none}
.inkall.inking .qa-l,.inkall.hasink .qa-l{position:static!important}
.inkbar-w{display:flex;justify-content:flex-end;margin-left:auto}
.qa-l > .top{flex-wrap:wrap;row-gap:8px}
.inkbar.float{position:fixed;z-index:40;background:var(--card);border-radius:16px;padding:6px 8px;box-shadow:0 0 0 .5px var(--line),0 8px 24px rgba(0,0,0,.16);max-width:calc(100vw - 16px)}
.inkbar .inkbtn.las.on{background:#ff3b30;color:#fff;box-shadow:0 0 10px rgba(255,59,48,.55)}
@media (min-width: 700px){ .qt{padding:8px 10px 6px} table.qt-tb{font-size:13px;letter-spacing:0} table.qt-tb th,table.qt-tb td{padding:3px 8px} .inkbtn{font-size:13.5px;padding:7px 13px} .inkbar .dot{width:28px;height:28px} }
/* ───── 태블릿 (아이패드) ───── */
@media (min-width: 700px){
  html,body{font-size:17px}
  .wrap{max-width:900px;padding:20px 32px 40px}
  h1{font-size:34px} h2{font-size:22px;margin-top:32px}
  .card{padding:18px 20px}
  .sub{font-size:15px} .tag{font-size:12px} .stat span{font-size:13.5px} .stat b{font-size:27px}
  .list .it > span:last-child{white-space:nowrap}
  .q{font-size:19px}
  pre.code{font-size:14.5px;padding:14px 16px}
  .opt{padding:16px 18px;font-size:16.5px}
  .opt .n{flex-basis:28px;height:28px}
  .exp{font-size:16.5px;padding:18px 22px}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin:12px 0}
  .cgrid > .card{margin:0}
  .ugrid{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-items:start}
  .tabbar{padding-left:max(0px,calc(50% - 320px));padding-right:max(0px,calc(50% - 320px))}
  .tabbar button{font-size:11.5px;padding:9px 0 7px}
  .qbar{margin:-20px -32px 0;padding-left:32px;padding-right:32px}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{max-width:720px;border-radius:22px;max-height:84vh;padding:22px 26px 26px}
  .sheet .grab{display:none}
  .flash{min-height:380px;font-size:28px}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom))}
  table.t{font-size:13.5px}
}
/* 가로로 넓을 때: 홈 2단, 문제는 왼쪽 지문 / 오른쪽 보기 */
@media (min-width: 1000px){
  .wrap{max-width:1180px}
  .hgrid{display:grid;grid-template-columns:1.05fr 1fr;grid-template-areas:"hl hr" "hd hr";column-gap:28px;align-items:start}
  .hl{grid-area:hl} .hr{grid-area:hr} .hd{grid-area:hd}
  .hgrid .hr > h2:first-child{margin-top:12px}
  .qa{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:6px}
  .qa-l{position:sticky;top:calc(64px + env(safe-area-inset-top))}
  .qa-r > .opt:first-child{margin-top:0}
}
.opt .ot{flex:1;min-width:0}.opt .why{display:none;margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--sub);font-weight:400}.opt.open .why{display:block}.opt.wrong .why{color:var(--bad);font-weight:500}.opt.hasw{cursor:pointer}.why-hint{font-size:12.5px;color:var(--sub2);text-align:center;margin:4px 0 6px}

/* ───── 지문 ───── */
.psg{background:var(--card);border-radius:18px;margin:10px 0 14px;position:relative;overflow:hidden}
.psg-sc{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 12px}
.psg.full .psg-sc{max-height:none}
.psg-tg{display:block;width:100%;font-size:14px;font-weight:500;color:var(--pri);padding:12px 0;box-shadow:0 -.5px 0 var(--line)}
.doc + .doc{margin-top:20px;padding-top:18px;box-shadow:0 -.5px 0 var(--line)}
.doc-k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sub);text-transform:uppercase;margin-bottom:10px;background:var(--fill);padding:3px 8px;border-radius:6px}
.doc-h{font:13.5px/1.6 var(--sans);color:var(--ink);margin-bottom:12px;background:var(--fill2);border-radius:12px;padding:9px 12px}
.doc-h b{color:var(--sub);font-weight:600;display:inline-block;min-width:64px;font-size:12.5px}
.doc-t{font-weight:700;font-size:17px;margin:2px 0 10px;font-family:var(--serif);letter-spacing:-.01em}
.doc p{margin:0 0 10px;line-height:1.65;font-size:16px;font-family:var(--serif);word-break:normal;letter-spacing:0}
.doc .chat{margin:0 0 10px;line-height:1.5;font-size:15px;font-family:var(--sans)}
.doc .chat b{font-weight:600} .doc .chat i{font-style:normal;color:var(--sub2);font-size:12.5px;margin-right:6px;font-variant-numeric:tabular-nums}
.doc table.dt{border-collapse:separate;border-spacing:0;width:100%;margin:6px 0 12px;font-size:13.5px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px var(--line)}
.doc table.dt td,.doc table.dt th{border-bottom:.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.doc table.dt tr:last-child td{border-bottom:0}
.doc table.dt th{background:var(--fill2);font-weight:600;color:var(--sub);font-size:12.5px}
.blank{display:inline-block;min-width:74px;border-bottom:2px solid var(--sub2);text-align:center;font:600 13px var(--sans);color:var(--sub);padding:0 4px;margin:0 2px}
.blank.cur{border-color:var(--pri);color:var(--pri);background:var(--pri-soft);border-radius:5px 5px 0 0}
.ins{font:700 13px var(--sans);color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:1px 5px;margin:0 2px}
